
services:
  mongodb:
    image: mongo:8.0
    container_name: mongo_db
    ports:
      - "27018:27017"

  backend:
    build: ./backend
    container_name: go_backend
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: vue_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data: